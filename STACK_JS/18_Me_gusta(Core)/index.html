<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="SashaBarrera">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="header">
        <nav class="header-nav">
            <p>Social Like</p>
        </nav>
    </header>

    <main class="main">
        <section class="tarjeta-perfil">
            <img src="static/image/pochacco.jpg" alt="Pochacco">
            <h1>Pochacco</h1>
            <button class="boton-perfil">Mi perfil</button>
        </section>

        <section class="derecha">
            <div>
                <h1>Últimas publicaciones</h1>
            </div>
            <section class="caja">
                <div class="descripcion-caja">
                    <h1>Rei</h1>
                    <p>0 like(s)</p>
                    <div>
                        <button class="" id="">Like</button>
                    </div>
                    <p>Acabo de configurar este nuevo
                        <a href="#">bot de Discrod,</a>
                        cuéntame que opinan ustedes.
                    </p>
                </div>
            </section>

            <section class="caja">
                <div class="descripcion-caja">
                    <h1>Asuka</h1>
                    <p>0 like(s)</p>
                    <div>
                        <button class="" id="">Like</button>
                    </div>
                    <p>Acabo de leer este
                        <a href="#">nuevo comic.</a>
                        Denle un vistazo.
                    </p>
                </div>
            </section>

            <section class="caja">
                <div class="descripcion-caja">
                    <h1>Shinji</h1>
                    <p>0 like(s)</p>
                    <div>
                        <button class="" id="">Like</button>
                    </div>
                    <p>No puedo dejar de escuchar este
                        <a href="#">album.</a>
                        ¿A quién más le gusta?
                    </p>
                </div>
            </section>
        </section>

    </main>


    <footer></footer>



    <script src="static/js/scripts.js"></script>
</body>

</html>
