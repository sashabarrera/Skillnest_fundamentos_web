<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="SashaBarrera">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="header">
        <nav class="header-nav">
            <h1>Social Like</h1>
        </nav>
    </header>

    <main class="main">
        <section class="tarjeta-perfil">
            <img src="static/image/pochacco-pajaritos.png" alt="Pochacco">
            <h2>Pochacco</h2>
            <button class="boton-perfil">Mi perfil</button>
        </section>

        <section class="derecha">
            <div>
                <h2>Últimas publicaciones</h2>
            </div>
            <section class="caja">
                <div class="descripcion-caja">
                    <div class="encabezado-publicacion">
                        <h2>Rei</h2>
                        <div class="contenedor-likes">
                            <span id="meGustas">0 like(s)</span>
                            <button class="descripcion-boton" id="botonPrimero">Like</button>
                        </div>
                    </div>
                    <p>Acabo de configurar este nuevo
                        <a href="#">bot de Discord,</a>
                        cuéntame qué opinan ustedes.
                    </p>
                </div>
            </section>

            <section class="caja">
                <div class="descripcion-caja">
                    <div class="encabezado-publicacion">
                        <h2>Asuka</h2>
                        <div class="contenedor-likes">
                            <span id="meGustas">0 like(s)</span>
                            <button class="descripcion-boton" id="botonSegundo">Like</button>
                        </div>
                    </div>
                    <p>Acabo de leer este
                        <a href="#">nuevo comic.</a>
                        Denle un vistazo.
                    </p>
                </div>
            </section>

            <section class="caja">
                <div class="descripcion-caja">
                    <div class="encabezado-publicacion">
                        <h2>Shinji</h2>
                        <div class="contenedor-likes">
                            <span id="meGustas">0 like(s)</span>
                            <button class="descripcion-boton" id="botonTercero">Like</button>
                        </div>
                    </div>
                    <p>No puedo dejar de escuchar este
                        <a href="#">album.</a>
                        ¿A quién más le gusta?
                    </p>
                </div>
            </section>
        </section>

    </main>

    <footer></footer>

    <script src="static/js/scripts.js"></script>
</body>

</html>
